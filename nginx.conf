# todoapp-web 站点配置（AD-15）：托管 dist/，/api 反代到 api:8080。
# Dockerfile 把本文件拷为 /etc/nginx/conf.d/default.conf；运行时行为由 Story 4.2 在 staging 验证。
# 端口发布由 deploy/compose.yaml 决定（只绑 127.0.0.1），这里只监听容器内 80。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA：非 /api 的路径都回退到 index.html
    location / {
        try_files $uri /index.html;
    }

    # index.html（含 SPA 回退命中的情况）不缓存，保证新版本立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 带内容哈希的构建产物长期缓存
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api {
        # Docker 内置 DNS；变量形式的 proxy_pass 让每次请求都重新解析 api（重建 api 容器后不会持续 502）
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        # 不带 URI 部分：原请求 URI 原样转发，不剥 /api 前缀
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 只改写上游 502/503/504；400/404/409/500 的契约错误体原样透传
        proxy_intercept_errors on;
        error_page 502 503 504 =500 @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        return 500 '{"error":{"code":"INTERNAL_ERROR","message":"服务器内部错误"}}';
    }
}
